[project]
name = "a11y-auditor"
version = "0.1.0"
description = "LLM-assisted WCAG accessibility smoke-testing framework built on Playwright, pytest, and Allure."
license = "MIT"
authors = [
    {name = "Hazem Khaled",email = "hazem.mkhaled@icloud.com"}
]
readme = "README.md"
keywords = ["accessibility", "a11y", "wcag", "playwright", "pytest", "llm", "allure"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-xdist>=3.0.0,<4.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "allure-pytest>=2.0.0,<3.0.0",
    "litellm>=1.0.0,<2.0.0",
    "concurrent-log-handler>=0.9.0,<0.10.0",
    "tenacity>=9.0.0,<10.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "playwright>=1.0.0,<2.0.0",
    "pytest-playwright-axe>=4.0.0,<5.0.0",
    "tqdm>=4.0.0,<5.0.0"
]

[tool.poetry]
package-mode = false
packages = [
    { include = "llm", from = "src" },
    { include = "utils", from = "src" },
    { include = "web", from = "src" },
    { include = "tests" }
]

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pre-commit = "*"
pip-audit = "*"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["llm", "utils", "web", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
namespace_packages = true
explicit_package_bases = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
